[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Paper-trading and backtesting framework with a rich CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "rich>=13.0", "fastapi>=0.110"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
yahoo = ["yfinance>=0.2"]
dev = ["pytest>=8.0"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
